<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Shield Glow -->
  <path d="M32 4 L54 13 V29 C54 44.5 44.5 55.5 32 60 C19.5 55.5 10 44.5 10 29 V13 Z" fill="url(#shieldGrad)" stroke="url(#cyberGrad)" stroke-width="2.5" filter="url(#glow)"/>
  <!-- Circuit Grid Lines inside Shield -->
  <path d="M32 14 V48" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.6"/>
  <path d="M22 28 H42" stroke="#00f2fe" stroke-width="1.5" opacity="0.6"/>
  <path d="M25 38 H39" stroke="#00f2fe" stroke-width="1.5" opacity="0.6"/>
  <!-- Central Lock / Radar Core -->
  <circle cx="32" cy="28" r="5" fill="#00f2fe"/>
  <circle cx="32" cy="28" r="9" stroke="#00f2fe" stroke-width="1.5" opacity="0.4"/>
  <!-- Bottom Node -->
  <circle cx="32" cy="48" r="3" fill="#38bdf8"/>
  <circle cx="22" cy="28" r="2.5" fill="#38bdf8"/>
  <circle cx="42" cy="28" r="2.5" fill="#38bdf8"/>
</svg>

